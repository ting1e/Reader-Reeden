<div class="flex flex-col gap-2">
    {% if list %}
    <div class="text-xs text-base-content/50 px-1 pb-1">{{ list|length }} 条结果</div>
    {% endif %}
    {% for item in list %}
    <form action="{% url 'reader:book_view' %}" method="POST">
        {% csrf_token %}
        <input type="hidden" name="book_id" value="{{ item.book_pk }}">
        <input type="hidden" name="chapter_id" value="{{ item.chapter_pk }}">
        <input type="hidden" name="words_read" value="{{ item.offset }}">
        <button type="submit" class="list-group-item w-full text-left px-4 py-3 rounded-lg transition-colors duration-150 cursor-pointer border
            {% if chapter_pk == item.chapter_pk %}active bg-primary/15 border-primary text-primary{% else %}bg-base-100 border-base-200 hover:border-base-300 hover:bg-base-200/60{% endif %}">
            <div class="search-chapter-label flex items-center gap-1.5 mb-1.5 text-xs {% if chapter_pk == item.chapter_pk %}text-primary/80{% else %}text-base-content/50{% endif %}">
                <iconify-icon icon="bi:file-earmark-text" class="shrink-0"></iconify-icon>
                <span class="truncate font-medium">{{ item.chapter_title }}</span>
            </div>
            <p class="break-words leading-relaxed text-sm search-snippet">{{ item.content }}</p>
        </button>
    </form>
    {% empty %}
        <div class="text-center text-base-content/40 py-16 flex flex-col items-center gap-3">
            <iconify-icon icon="bi:search" class="text-3xl"></iconify-icon>
            <p class="text-sm">未找到匹配内容</p>
        </div>
    {% endfor %}
</div>
